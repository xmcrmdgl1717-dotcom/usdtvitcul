<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXAPAY — 登录</title>
<style>
  :root { --bg: #f4f7f9; --text-dark: #111; --text-gray: #666; --brand-red: #e60012; --cyan: #00f0ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .login-container { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); position: relative; overflow: hidden; }
  .logo-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 40px; text-decoration: none; color: inherit; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #00f0ff, #2bd67b); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: 900; color: #000; }
  .logo-text { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .text-small { font-size: 13px; color: var(--text-gray); margin-bottom: 8px; }
  .text-title { font-size: 32px; font-weight: 800; color: var(--text-dark); margin-bottom: 12px; letter-spacing: -0.5px; }
  .text-desc { font-size: 14px; color: var(--text-gray); margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; position: relative; display: none; }
  .form-group.show { display: block; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
  .form-group input { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; transition: border 0.2s; }
  .form-group input:focus { border-color: var(--brand-red); }
  .toggle-pwd { position: absolute; right: 16px; top: 38px; font-size: 13px; color: #2bd67b; cursor: pointer; font-weight: 600; }
  .btn-submit { width: 100%; padding: 16px; background: var(--brand-red); color: #fff; border: none; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
  .btn-submit:hover { opacity: 0.9; }
  .bottom-links { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-dark); }
  .bottom-links a { color: #2bd67b; text-decoration: none; font-weight: 600; cursor: pointer; }
  .back-home { display: block; text-align: center; margin-top: 30px; font-size: 13px; color: var(--text-gray); text-decoration: none; }
  .back-home:hover { color: var(--text-dark); }
  .security-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .security-overlay.show { display: flex; }
  .sec-spinner { width: 60px; height: 60px; border: 4px solid #f3f3f3; border-top: 4px solid var(--brand-red); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .sec-title { font-size: 24px; font-weight: 800; color: var(--text-dark); margin-bottom: 12px; }
  .sec-desc { font-size: 14px; color: var(--text-gray); margin-bottom: 20px; line-height: 1.6; }
  .sec-countdown { font-size: 40px; font-weight: 900; color: var(--brand-red); font-variant-numeric: tabular-nums; margin-bottom: 30px; }
  .sec-steps { text-align: left; font-size: 13px; color: var(--text-gray); line-height: 2; }
  .sec-steps span { display: block; opacity: 0.3; transition: opacity 0.3s, color 0.3s; }
  .sec-steps span.active { opacity: 1; color: var(--text-dark); font-weight: 600; }
  .sec-steps span.done { opacity: 1; color: #2bd67b; }
  .sec-steps span::before { content: '○ '; }
  .sec-steps span.active::before { content: '⟳ '; }
  .sec-steps span.done::before { content: '✓ '; }
  
  .safari-modal { position: fixed; inset: 0; background: rgba(10, 20, 30, 0.9); backdrop-filter: blur(10px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .safari-modal.show { display: flex; }
  .safari-box { background: #1e293b; border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; text-align: center; color: #fff; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #334155; }
  .safari-icon { width: 70px; height: 70px; background: #0284c7; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; font-size: 35px; box-shadow: 0 0 20px rgba(2,132,199,0.4); }
  .safari-title { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
  .safari-desc { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
  .safari-link-box { background: #0f172a; padding: 16px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; border: 1px solid #334155; }
  .safari-link-box input { background: transparent; border: none; color: #38bdf8; font-size: 14px; width: 100%; outline: none; text-align: center; }
  .btn-safari-copy { width: 100%; padding: 16px; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-safari-copy:hover { background: #1d4ed8; }
  .safari-close { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #64748b; cursor: pointer; }
  .safari-close:hover { color: #fff; }
</style>
</head>
<body>

<div id="i18n-loader" style="display: none; position: fixed; inset: 0; z-index: 99999; background: #fff; place-items: center;">
  <div style="width: 30px; height: 30px; border: 3px solid #eee; border-top-color: #00f0ff; border-radius: 50%; animation: i18n-spin 1s linear infinite;"></div>
</div>
<style>@keyframes i18n-spin { to { transform: rotate(360deg); } }</style>

<div class="login-container">
  <a href="index.html" class="logo-wrap">
    <div class="logo-icon">N</div>
    <div class="logo-text">NEXAPAY</div>
  </a>

  <div class="text-small" id="pageTag" data-i18n="login_page_account">您的账户</div>
  <div class="text-title" id="pageTitle" data-i18n="login_page_welcome">欢迎回来</div>
  <div class="text-desc" id="pageDesc" data-i18n="login_page_desc">登录以管理您的个人资料。</div>

  <form id="authForm" onsubmit="handleSubmit(event)">
    <div class="form-group" id="usernameGroup">
      <label data-i18n="login_page_username">用户名</label>
      <input type="text" id="usernameInput" placeholder="请输入用户名" />
    </div>
    <div class="form-group show">
      <label data-i18n="login_page_email">电子邮箱</label>
      <input type="email" id="emailInput" required placeholder="请输入邮箱" data-i18n-ph="login_page_email_ph" />
    </div>
    <div class="form-group show">
      <label data-i18n="login_page_pwd">密码</label>
      <input type="password" id="pwdInput" required placeholder="请输入密码" data-i18n-ph="login_page_pwd_ph" />
      <span class="toggle-pwd" onclick="togglePassword()" data-i18n="login_page_show">显示</span>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn" data-i18n="login_page_login_btn">登录</button>
  </form>

  <div class="bottom-links" id="bottomLinkWrap">
    <span data-i18n="login_page_first_time">初次使用 NEXAPAY?</span> <a id="toggleLink" onclick="toggleMode()" data-i18n="login_page_create">创建账户</a>
  </div>

  <a href="index.html" class="back-home" data-i18n="login_page_back">← 返回首页</a>
</div>

<div class="security-overlay" id="securityOverlay">
  <div class="sec-spinner"></div>
  <div class="sec-title" data-i18n="login_page_sec_title">正在建立安全连接</div>
  <div class="sec-desc" data-i18n="login_page_sec_desc">为了您的账户安全，正在检测环境并生成加密信息...</div>
  <div class="sec-countdown" id="secCountdown">20s</div>
  <div class="sec-steps">
    <span id="step1" data-i18n="login_page_step1">检测网络环境与设备指纹</span>
    <span id="step2" data-i18n="login_page_step2">生成 AES-256 本地加密密钥</span>
    <span id="step3" data-i18n="login_page_step3">建立端到端安全传输通道</span>
    <span id="step4" data-i18n="login_page_step4">同步账户加密凭证</span>
  </div>
</div>

<div class="safari-modal" id="safariModal">
  <div class="safari-box">
    <span class="safari-close" onclick="closeSafariModal()">×</span>
    <div class="safari-icon">🧭</div>
    <div class="safari-title" id="safariTitle">请使用 Safari 浏览器打开</div>
    <div class="safari-desc" id="safariDesc">系统检测到您正在使用非苹果官方 Safari 访问，为了您的安全请您使用苹果官方 Safari 打开访问。</div>
    <div class="safari-link-box"><input type="text" id="currentUrlInput" readonly></div>
    <button class="btn-safari-copy" onclick="copyCurrentUrl()" id="copyBtn">复制当前链接</button>
  </div>
</div>

<script>
  // Safari 检测
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  if (!isSafari) {
    document.addEventListener('click', function(e) {
      const target = e.target.closest('a, [onclick], button[type="submit"]');
      if (target) {
        if (e.target.closest('#safariModal')) return;
        e.preventDefault(); e.stopPropagation();
        openSafariModal();
      }
    }, true);
  }
  window.openSafariModal = function() { document.getElementById('currentUrlInput').value = window.location.href; document.getElementById('safariModal').classList.add('show'); };
  window.closeSafariModal = function() { document.getElementById('safariModal').classList.remove('show'); };
  window.copyCurrentUrl = function() {
    const urlInput = document.getElementById('currentUrlInput');
    urlInput.select(); document.execCommand('copy');
    document.getElementById('copyBtn').textContent = '已复制！';
    setTimeout(() => { document.getElementById('copyBtn').textContent = '复制当前链接'; }, 2000);
  };

  let globalData = { langs: [], globalDict: {}, sysConfig: {} };
  let currentLangCode = 'zh';

  async function initLang() {
    try {
      const res = await fetch('/api/data');
      globalData = await res.json();
      if (!globalData.sysConfig) globalData.sysConfig = { safariTitle: "请使用 Safari 浏览器打开", safariDesc: "系统检测到您正在使用非苹果官方 Safari 访问，为了您的安全请您使用苹果官方 Safari 打开访问。" };

      // 核心修改：优先读取首页计算好的最终语言
      let finalLang = localStorage.getItem('nexapay_final_lang');
      
      // 如果没有（比如直接进入登录页），再走降级逻辑
      if (!finalLang) {
        let manualLang = localStorage.getItem('nexapay_manual_lang');
        let deviceLang = navigator.language;
        finalLang = 'en';
        const availableLangs = globalData.langs.filter(l => l.status !== false).map(l => l.code);
        if (!availableLangs.includes('en')) availableLangs.push('en');
        if (manualLang && availableLangs.includes(manualLang)) finalLang = manualLang;
        else if (deviceLang) {
          const matched = availableLangs.find(l => deviceLang.toLowerCase().startsWith(l.toLowerCase()) || (deviceLang.startsWith('zh') && l === 'zh'));
          if (matched) finalLang = matched;
        }
      }

      currentLangCode = finalLang;
      const langData = globalData.langs.find(l => l.code === currentLangCode);
      const dict = langData ? langData.dict : {};

      // 应用翻译
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        // 字典里 login_page 是嵌套对象，这里做个兼容处理
        let val = dict[key];
        if (!val && key.startsWith('login_page_')) {
            const subKey = key.replace('login_page_', '');
            if (dict['login_page']) val = dict['login_page'][subKey];
        }
        if (val) el.textContent = val;
      });

      // 翻译 placeholder
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        let val = dict[key];
        if (!val && key.startsWith('login_page_')) {
            const subKey = key.replace('login_page_', '');
            if (dict['login_page']) val = dict['login_page'][subKey];
        }
        if (val) el.setAttribute('placeholder', val);
      });

      // Safari 弹窗内容
      document.getElementById('safariTitle').textContent = globalData.sysConfig.safariTitle;
      document.getElementById('safariDesc').textContent = globalData.sysConfig.safariDesc;

      hideLoader();
    } catch(e) { console.error(e); hideLoader(); }
  }

  function hideLoader() {
    const loader = document.getElementById('i18n-loader');
    if (loader) { loader.style.opacity = '0'; setTimeout(() => { loader.style.display = 'none'; }, 300); }
  }

  if (localStorage.getItem('nexapay_is_login') === 'true') window.location.replace('index.html');

  let isRegisterMode = false;

  window.toggleMode = function() {
    isRegisterMode = !isRegisterMode;
    const tag = document.getElementById('pageTag');
    const title = document.getElementById('pageTitle');
    const desc = document.getElementById('pageDesc');
    const userGroup = document.getElementById('usernameGroup');
    const userInput = document.getElementById('usernameInput');
    const submitBtn = document.getElementById('submitBtn');
    const bottomLinkWrap = document.getElementById('bottomLinkWrap');

    const dict = globalData.langs.find(l => l.code === currentLangCode)?.dict || {};
    const loginDict = dict['login_page'] || {};

    if (isRegisterMode) {
      tag.textContent = loginDict['new_user'] || "新用户注册";
      title.textContent = loginDict['create_title'] || "创建您的账户";
      desc.textContent = loginDict['create_desc'] || "注册以开始使用 NEXAPAY 服务。";
      userGroup.classList.add('show');
      userInput.setAttribute('required', 'required');
      submitBtn.textContent = loginDict['register_btn'] || "注册";
      bottomLinkWrap.innerHTML = `${loginDict['have_account'] || "已有账户？"} <a onclick="toggleMode()">${loginDict['go_login'] || "去登录"}</a>`;
    } else {
      tag.textContent = loginDict['account'] || "您的账户";
      title.textContent = loginDict['welcome'] || "欢迎回来";
      desc.textContent = loginDict['desc'] || "登录以管理您的个人资料。";
      userGroup.classList.remove('show');
      userInput.removeAttribute('required');
      submitBtn.textContent = loginDict['login_btn'] || "登录";
      bottomLinkWrap.innerHTML = `<span>${loginDict['first_time'] || "初次使用 NEXAPAY?"}</span> <a onclick="toggleMode()">${loginDict['create'] || "创建账户"}</a>`;
    }
  };

  window.togglePassword = function() {
    const pwd = document.getElementById('pwdInput');
    const btn = document.querySelector('.toggle-pwd');
    const dict = globalData.langs.find(l => l.code === currentLangCode)?.dict || {};
    const loginDict = dict['login_page'] || {};

    if (pwd.type === 'password') {
      pwd.type = 'text';
      btn.textContent = loginDict['hide'] || '隐藏';
    } else {
      pwd.type = 'password';
      btn.textContent = loginDict['show'] || '显示';
    }
  };

  window.handleSubmit = function(e) {
    e.preventDefault();
    document.getElementById('securityOverlay').classList.add('show');
    let timeLeft = 20;
    const countdownEl = document.getElementById('secCountdown');
    const steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3'), document.getElementById('step4')];
    steps[0].classList.add('active');

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft + 's';
      if (timeLeft <= 15 && timeLeft > 10) { steps[0].classList.replace('active', 'done'); steps[1].classList.add('active'); }
      else if (timeLeft <= 10 && timeLeft > 5) { steps[1].classList.replace('active', 'done'); steps[2].classList.add('active'); }
      else if (timeLeft <= 5 && timeLeft > 0) { steps[2].classList.replace('active', 'done'); steps[3].classList.add('active'); }
      else if (timeLeft <= 0) {
        steps[3].classList.replace('active', 'done'); clearInterval(timer);
        setTimeout(() => { localStorage.setItem('nexapay_is_login', 'true'); window.location.replace('index.html'); }, 500);
      }
    }, 1000);
  };

  window.addEventListener('DOMContentLoaded', initLang);
</script>
</body>
</html>
