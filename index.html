<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXAPAY — 快速。流畅。安全。</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 覆盖原有的居中排版，改为左右布局 */
  .hero {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 8vw;
  }
  
  .hero-content {
    max-width: 800px;
    text-align: left;
    margin-top: -40px;
  }

  .greotpay-title {
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #fff;
    margin-bottom: 20px;
    line-height: 1.1;
  }

  .greotpay-sub {
    font-size: clamp(18px, 2vw, 24px);
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 16px;
    font-weight: 500;
  }

  /* 分割线 */
  .divider-line {
    width: 100%;
    height: 1px;
    background: rgba(255, 255, 255, 0.15);
    margin: 40px 0 30px;
  }

  /* 折叠菜单 */
  .accordion-section {
    width: 100%;
    max-width: 600px;
  }
  
  .accordion-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    cursor: pointer;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    border-bottom: 1px solid transparent;
    transition: all 0.3s;
  }
  
  .accordion-header:hover {
    color: var(--cyan);
  }

  .accordion-header .icon {
    font-size: 24px;
    font-weight: 300;
    color: #fff;
    transition: transform 0.3s;
  }

  .accordion-header.active .icon {
    transform: rotate(45deg);
  }

  .accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 20px;
    opacity: 0;
  }

  .accordion-content.open {
    max-height: 500px;
    opacity: 1;
    padding: 10px 0 30px;
  }

  .accordion-content a {
    color: rgba(255, 255, 255, 0.7);
    font-size: 15px;
    text-decoration: none;
    transition: color 0.2s;
    white-space: nowrap;
  }

  .accordion-content a:hover {
    color: #fff;
  }

  /* 右上角登录注册 */
  .auth-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn-auth {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .btn-auth:hover {
    color: var(--cyan);
  }

  .btn-register {
    padding: 8px 20px;
    border-radius: 8px;
    background: #fff;
    color: #000;
  }

  .btn-register:hover {
    background: var(--cyan-soft);
    color: #000;
  }

  /* 简单弹窗样式 */
  .auth-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .auth-modal.show {
    display: flex;
  }
  .auth-box {
    background: #0a1e28;
    border: 1px solid var(--border-2);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    position: relative;
  }
  .auth-box h3 {
    font-size: 24px;
    color: #fff;
    margin-bottom: 20px;
  }
  .auth-box input {
    width: 100%;
    padding: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #fff;
    margin-bottom: 16px;
    outline: none;
  }
  .auth-box input:focus {
    border-color: var(--cyan);
  }
  .auth-box .btn-main {
    width: 100%;
    margin-bottom: 20px;
  }
  .auth-box .close-modal {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 24px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
  }
  .auth-box .close-modal:hover {
    color: #fff;
  }

  @media (max-width: 768px) {
    .hero { padding: 0 5vw; align-items: flex-start; padding-top: 120px; }
    .accordion-content { grid-template-columns: repeat(2, 1fr); }
    .greotpay-title { font-size: 40px; }
    .auth-actions { display: none; /* 移动端隐藏，或者可以放到汉堡菜单 */ }
  }
</style>
</head>
<body>

<!-- 多语言防闪烁遮罩层 -->
<div id="i18n-loader" style="display: none; position: fixed; inset: 0; z-index: 99999; background: #05080c; place-items: center; transition: opacity 0.3s ease;">
  <div style="width: 40px; height: 40px; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: #00f0ff; border-radius: 50%; animation: i18n-spin 1s linear infinite;"></div>
</div>
<style>
  @keyframes i18n-spin { to { transform: rotate(360deg); } }
</style>
<script>
  (function() {
    var lang = localStorage.getItem('nexapay_manual_lang');
    if (lang && lang !== 'zh') {
      var loader = document.getElementById('i18n-loader');
      if (loader) loader.style.display = 'grid';
    }
  })();
</script>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
</div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<!-- 语言切换器 -->
<div class="lang-switch-wrap">
  <div class="lang-switch-btn" onclick="toggleLangMenu(event)">🌏</div>
  <div class="lang-dropdown" id="langDropdown"></div>
</div>

<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#">
      <span class="logo-mark">N</span>
      <span>NEXAPAY</span>
    </a>
    
    <!-- 右上角登录注册 -->
    <div class="auth-actions">
      <span class="btn-auth" onclick="openAuthModal('登录')">登录</span>
      <span class="btn-auth btn-register" onclick="openAuthModal('注册')">注册</span>
    </div>
  </div>
</header>

<!-- 视频背景区域 -->
<section class="hero">
  <video class="hero-video" autoplay muted loop playsinline preload="auto">
    <source src="homeBg.3__npe53rz97a.webm" type="video/webm" />
  </video>

  <div class="hero-overlay" aria-hidden="true"></div>

  <!-- 左侧主内容区 -->
  <div class="hero-content">
    <div class="greotpay-sub">与 NEXAPAY 开启稳定币支付之旅</div>
    <h1 class="greotpay-title">快速。流畅。安全。</h1>

    <div class="divider-line"></div>

    <!-- 个人折叠菜单 -->
    <div class="accordion-section">
      <div class="accordion-header active" onclick="toggleAccordion(this)">
        <span>个人</span>
        <span class="icon">+</span>
      </div>
      <div class="accordion-content open">
        <a href="#">卡片</a>
        <a href="#">扫码支付</a>
        <a href="#">手机充值</a>
        <a href="#">信用额度</a>
        <a href="#">全球转账</a>
        <a href="#">应用内转账</a>
        <a href="#">多币种钱包</a>
        <a href="#">赚币</a>
        <a href="#">兑换</a>
        <a href="#">P2P 市场</a>
        <a href="#">NEXAPAY Pro</a>
        <a href="#">积分与奖励</a>
      </div>
    </div>

    <!-- 企业折叠菜单 -->
    <div class="accordion-section">
      <div class="accordion-header" onclick="toggleAccordion(this)">
        <span>企业</span>
        <span class="icon">+</span>
      </div>
      <div class="accordion-content">
        <a href="#">企业账户</a>
        <a href="#">批量支付</a>
        <a href="#">API 接入</a>
        <a href="#">发卡服务</a>
      </div>
    </div>

  </div>
</section>

<!-- 登录/注册弹窗 -->
<div class="auth-modal" id="authModal">
  <div class="auth-box">
    <span class="close-modal" onclick="closeAuthModal()">×</span>
    <h3 id="authTitle">登录</h3>
    <input type="email" placeholder="邮箱地址" />
    <input type="password" placeholder="密码" />
    <button class="btn-main" onclick="closeAuthModal()">确认</button>
    <p style="font-size:12px; color:var(--muted);">此为演示功能，无实际后端逻辑。</p>
  </div>
</div>

<script src="script.js"></script>
<script>
  // 折叠菜单逻辑
  window.toggleAccordion = function(header) {
    const content = header.nextElementSibling;
    const icon = header.querySelector('.icon');
    
    // 关闭其他所有
    document.querySelectorAll('.accordion-header').forEach(h => {
      if (h !== header) {
        h.classList.remove('active');
        h.nextElementSibling.classList.remove('open');
        h.querySelector('.icon').textContent = '+';
      }
    });

    // 切换当前
    header.classList.toggle('active');
    content.classList.toggle('open');
    
    if (content.classList.contains('open')) {
      icon.textContent = '×';
    } else {
      icon.textContent = '+';
    }
  };

  // 弹窗逻辑
  window.openAuthModal = function(type) {
    document.getElementById('authTitle').textContent = type;
    document.getElementById('authModal').classList.add('show');
  };

  window.closeAuthModal = function() {
    document.getElementById('authModal').classList.remove('show');
  };
</script>
</body>
</html>
