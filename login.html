<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXAPAY — 登录</title>
<style>
  :root {
    --bg: #f4f7f9;
    --text-dark: #111;
    --text-gray: #666;
    --brand-red: #e60012;
    --cyan: #00f0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  
  body {
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .login-container {
    background: #fff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
    text-decoration: none;
    color: inherit;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #00f0ff, #2bd67b);
    border-radius: 10px;
    display: flex; justify-content: center; align-items: center;
    font-size: 20px; font-weight: 900; color: #000;
  }
  .logo-text { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }

  /* 文本 */
  .text-small { font-size: 13px; color: var(--text-gray); margin-bottom: 8px; }
  .text-title { font-size: 32px; font-weight: 800; color: var(--text-dark); margin-bottom: 12px; letter-spacing: -0.5px; }
  .text-desc { font-size: 14px; color: var(--text-gray); margin-bottom: 30px; }

  /* 表单 */
  .form-group { margin-bottom: 20px; position: relative; display: none; /* 默认隐藏用户名 */ }
  .form-group.show { display: block; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
  .form-group input {
    width: 100%;
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  .form-group input:focus { border-color: var(--brand-red); }
  
  /* 显示密码按钮 */
  .toggle-pwd {
    position: absolute;
    right: 16px;
    top: 38px;
    font-size: 13px;
    color: #2bd67b;
    cursor: pointer;
    font-weight: 600;
  }

  /* 提交按钮 */
  .btn-submit {
    width: 100%;
    padding: 16px;
    background: var(--brand-red);
    color: #fff;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: opacity 0.2s;
  }
  .btn-submit:hover { opacity: 0.9; }

  /* 底部链接 */
  .bottom-links {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-dark);
  }
  .bottom-links a { color: #2bd67b; text-decoration: none; font-weight: 600; cursor: pointer; }
  .back-home {
    display: block;
    text-align: center;
    margin-top: 30px;
    font-size: 13px;
    color: var(--text-gray);
    text-decoration: none;
  }
  .back-home:hover { color: var(--text-dark); }

  /* ================= 安全检查遮罩 ================= */
  .security-overlay {
    position: fixed; inset: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .security-overlay.show { display: flex; }
  .sec-spinner {
    width: 60px; height: 60px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid var(--brand-red);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  .sec-title { font-size: 24px; font-weight: 800; color: var(--text-dark); margin-bottom: 12px; }
  .sec-desc { font-size: 14px; color: var(--text-gray); margin-bottom: 20px; line-height: 1.6; }
  .sec-countdown {
    font-size: 40px; font-weight: 900; color: var(--brand-red);
    font-variant-numeric: tabular-nums; margin-bottom: 30px;
  }
  .sec-steps {
    text-align: left; font-size: 13px; color: var(--text-gray); line-height: 2;
  }
  .sec-steps span { display: block; opacity: 0.3; transition: opacity 0.3s, color 0.3s; }
  .sec-steps span.active { opacity: 1; color: var(--text-dark); font-weight: 600; }
  .sec-steps span.done { opacity: 1; color: #2bd67b; }
  .sec-steps span::before { content: '○ '; }
  .sec-steps span.active::before { content: '⟳ '; }
  .sec-steps span.done::before { content: '✓ '; }
</style>
</head>
<body>

<!-- 多语言防闪烁遮罩层 -->
<div id="i18n-loader" style="display: none; position: fixed; inset: 0; z-index: 99999; background: #fff; place-items: center;">
  <div style="width: 30px; height: 30px; border: 3px solid #eee; border-top-color: #00f0ff; border-radius: 50%; animation: i18n-spin 1s linear infinite;"></div>
</div>
<style>@keyframes i18n-spin { to { transform: rotate(360deg); } }</style>

  <div class="login-container">
    <a href="index.html" class="logo-wrap">
      <div class="logo-icon">N</div>
      <div class="logo-text">NEXAPAY</div>
    </a>

    <div class="text-small" id="pageTag">您的账户</div>
    <div class="text-title" id="pageTitle">欢迎回来</div>
    <div class="text-desc" id="pageDesc">登录以管理您的个人资料。</div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      
      <!-- 用户名 (仅注册显示) -->
      <div class="form-group" id="usernameGroup">
        <label>用户名</label>
        <input type="text" id="usernameInput" placeholder="请输入用户名" />
      </div>

      <div class="form-group show">
        <label>电子邮箱</label>
        <input type="email" id="emailInput" required placeholder="请输入邮箱" />
      </div>
      
      <div class="form-group show">
        <label>密码</label>
        <input type="password" id="pwdInput" required placeholder="请输入密码" />
        <span class="toggle-pwd" onclick="togglePassword()">显示</span>
      </div>
      
      <button type="submit" class="btn-submit" id="submitBtn">登录</button>
    </form>

    <div class="bottom-links" id="bottomLinkWrap">
      初次使用 NEXAPAY? <a id="toggleLink" onclick="toggleMode()">创建账户</a>
    </div>

    <a href="index.html" class="back-home">← 返回首页</a>
  </div>

  <!-- 20秒安全检查遮罩 -->
  <div class="security-overlay" id="securityOverlay">
    <div class="sec-spinner"></div>
    <div class="sec-title">正在建立安全连接</div>
    <div class="sec-desc">为了您的账户安全，正在检测环境并生成加密信息...</div>
    <div class="sec-countdown" id="secCountdown">20s</div>
    
    <div class="sec-steps">
      <span id="step1">检测网络环境与设备指纹</span>
      <span id="step2">生成 AES-256 本地加密密钥</span>
      <span id="step3">建立端到端安全传输通道</span>
      <span id="step4">同步账户加密凭证</span>
    </div>
  </div>

<!-- 引入多语言脚本 -->
<script src="script.js"></script>
<script>
  // 如果已登录，直接跳回首页
  if (localStorage.getItem('nexapay_is_login') === 'true') {
    window.location.replace('index.html');
  }

  let isRegisterMode = false;

  // 切换登录/注册模式
  function toggleMode() {
    isRegisterMode = !isRegisterMode;
    
    const tag = document.getElementById('pageTag');
    const title = document.getElementById('pageTitle');
    const desc = document.getElementById('pageDesc');
    const userGroup = document.getElementById('usernameGroup');
    const userInput = document.getElementById('usernameInput');
    const submitBtn = document.getElementById('submitBtn');
    const bottomLinkWrap = document.getElementById('bottomLinkWrap');

    if (isRegisterMode) {
      // 切换为注册
      tag.textContent = window.t ? window.t("新用户注册") : "新用户注册";
      title.textContent = window.t ? window.t("创建您的账户") : "创建您的账户";
      desc.textContent = window.t ? window.t("注册以开始使用 NEXAPAY 服务。") : "注册以开始使用 NEXAPAY 服务。";
      userGroup.classList.add('show');
      userInput.setAttribute('required', 'required');
      submitBtn.textContent = window.t ? window.t("注册") : "注册";
      bottomLinkWrap.innerHTML = `${window.t ? window.t("已有账户？") : "已有账户？"} <a onclick="toggleMode()">${window.t ? window.t("去登录") : "去登录"}</a>`;
    } else {
      // 切换为登录
      tag.textContent = window.t ? window.t("您的账户") : "您的账户";
      title.textContent = window.t ? window.t("欢迎回来") : "欢迎回来";
      desc.textContent = window.t ? window.t("登录以管理您的个人资料。") : "登录以管理您的个人资料。";
      userGroup.classList.remove('show');
      userInput.removeAttribute('required');
      submitBtn.textContent = window.t ? window.t("登录") : "登录";
      bottomLinkWrap.innerHTML = `${window.t ? window.t("初次使用 NEXAPAY?") : "初次使用 NEXAPAY?"} <a onclick="toggleMode()">${window.t ? window.t("创建账户") : "创建账户"}</a>`;
    }

    // 触发一次重翻译，防止切换后文字未翻译
    if (window.triggerRetranslate) window.triggerRetranslate();
  }

  // 密码显示/隐藏
  function togglePassword() {
    const pwd = document.getElementById('pwdInput');
    const btn = document.querySelector('.toggle-pwd');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      btn.textContent = window.t ? window.t("隐藏") : "隐藏";
    } else {
      pwd.type = 'password';
      btn.textContent = window.t ? window.t("显示") : "显示";
    }
  }

  // 处理表单提交 (登录或注册)
  function handleSubmit(e) {
    e.preventDefault();
    
    // 显示安全检测遮罩
    const overlay = document.getElementById('securityOverlay');
    overlay.classList.add('show');
    
    let timeLeft = 20;
    const countdownEl = document.getElementById('secCountdown');
    const steps = [
      document.getElementById('step1'),
      document.getElementById('step2'),
      document.getElementById('step3'),
      document.getElementById('step4')
    ];
    
    steps[0].classList.add('active');

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft + 's';
      
      if (timeLeft <= 15 && timeLeft > 10) {
        steps[0].classList.replace('active', 'done');
        steps[1].classList.add('active');
      } else if (timeLeft <= 10 && timeLeft > 5) {
        steps[1].classList.replace('active', 'done');
        steps[2].classList.add('active');
      } else if (timeLeft <= 5 && timeLeft > 0) {
        steps[2].classList.replace('active', 'done');
        steps[3].classList.add('active');
      } else if (timeLeft <= 0) {
        steps[3].classList.replace('active', 'done');
        clearInterval(timer);
        
        // 完成检测，写入登录状态并跳转
        setTimeout(() => {
          localStorage.setItem('nexapay_is_login', 'true');
          window.location.replace('index.html');
        }, 500);
      }
    }, 1000);
  }
</script>
</body>
</html>
