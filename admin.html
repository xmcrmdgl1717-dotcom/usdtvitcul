<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA - 后台管理</title>
<style>
  :root {
    --bg: #f4f7f9; --surface: #ffffff; --text: #333; --text-light: #777;
    --primary: #2563eb; --primary-hover: #1d4ed8; --border: #e2e8f0;
    --success: #10b981; --success-bg: #d1fae5; --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  
  /* 登录界面 */
  #login-screen { position: fixed; inset: 0; background: var(--surface); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .login-box { width: 320px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--border); text-align: center; }
  .login-box h2 { margin-bottom: 20px; font-size: 20px; }
  .login-box input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
  .login-box button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .login-box button:hover { background: var(--primary-hover); }
  .err-msg { color: var(--danger); font-size: 13px; margin-bottom: 10px; display: none; }

  /* 侧边栏 */
  .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-logo { padding: 20px; font-size: 18px; font-weight: 800; border-bottom: 1px solid var(--border); color: var(--primary); }
  .menu-item { padding: 15px 20px; cursor: pointer; font-weight: 500; color: var(--text-light); transition: 0.2s; }
  .menu-item:hover, .menu-item.active { background: #eff6ff; color: var(--primary); border-right: 3px solid var(--primary); }
  .menu-item.has-sub { display: flex; justify-content: space-between; align-items: center; }
  .sub-menu { display: none; background: #f8fafc; }
  .sub-menu.open { display: block; }
  .sub-item { padding: 12px 20px 12px 40px; cursor: pointer; font-size: 14px; color: var(--text-light); }
  .sub-item:hover, .sub-item.active { color: var(--primary); }

  /* 主内容区 */
  .main-content { flex: 1; overflow-y: auto; padding: 30px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 22px; }
  .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 14px; }
  .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  
  .card { background: var(--surface); border-radius: 10px; padding: 24px; border: 1px solid var(--border); margin-bottom: 24px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
  .form-group input { width: 100%; max-width: 400px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
  
  /* 表格 */
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: #f8fafc; font-weight: 600; color: var(--text-light); }
  .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--success-bg); color: var(--success); }
  
  /* 弹窗 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); width: 600px; max-width: 90vw; border-radius: 10px; padding: 24px; max-height: 80vh; display: flex; flex-direction: column; }
  .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
  .modal-body { overflow-y: auto; flex: 1; }
  .modal-footer { margin-top: 15px; text-align: right; }
  .close-btn { cursor: pointer; font-size: 20px; color: var(--text-light); }
  
  /* 语言列表选择 */
  .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
  .lang-checkbox { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .lang-checkbox:hover { border-color: var(--primary); }
  .lang-checkbox input { cursor: pointer; }
  
  .json-editor { width: 100%; height: 300px; font-family: monospace; padding: 10px; border: 1px solid var(--border); border-radius: 6px; resize: vertical; }
  .actions span { color: var(--primary); cursor: pointer; margin-right: 12px; font-size: 14px; }
  .actions span:hover { text-decoration: underline; }
  
  /* 翻译 loading */
  .loading-overlay { display: none; align-items: center; justify-content: center; flex-direction: column; }
  .loading-overlay.show { display: flex; }
  .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 登录界面 -->
<div id="login-screen">
  <div class="login-box">
    <h2>NEXA 管理后台</h2>
    <div class="err-msg" id="login-err">密码错误，请重试</div>
    <input type="password" id="login-pwd" placeholder="请输入后台密码 (默认 admin888)" onkeydown="if(event.key==='Enter') doLogin()">
    <button onclick="doLogin()">登录系统</button>
  </div>
</div>

<!-- 系统主体 -->
<div class="sidebar" style="display:none;" id="sidebar">
  <div class="sidebar-logo">NEXA Admin</div>
  <div class="menu-item has-sub" onclick="toggleSubMenu(this)">多语言管理 <span>▼</span></div>
  <div class="sub-menu" id="sub-lang">
    <div class="sub-item active" onclick="switchTab('lang-list')">语言列表</div>
    <div class="sub-item" onclick="switchTab('dict-list')">字典全量编辑</div>
  </div>
  <div class="menu-item" onclick="switchTab('settings')">API 配置</div>
  <div style="flex:1"></div>
  <div class="menu-item" onclick="logout()">退出登录</div>
</div>

<div class="main-content" style="display:none;" id="main-content">
  
  <!-- 语言列表 Tab -->
  <div id="tab-lang-list">
    <div class="header">
      <h1>多语言管理</h1>
      <div style="display:flex; gap:10px;">
        <button class="btn" onclick="openBatchLangModal()">🌐 添加常用语言</button>
        <button class="btn btn-primary" onclick="globalTranslate()">⚡ 一键全局翻译</button>
      </div>
    </div>
    
    <div class="card">
      <h3 style="margin-bottom: 15px; font-size:16px;">添加新语言</h3>
      <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
        <div class="form-group" style="margin:0;"><label>代码</label><input type="text" id="new-lang-code" placeholder="如: jp" style="width:100px;"></div>
        <div class="form-group" style="margin:0;"><label>名称</label><input type="text" id="new-lang-name" placeholder="如: 日本語" style="width:150px;"></div>
        <button class="btn btn-primary" onclick="addSingleLang()">添加</button>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>状态开关</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="lang-tbody">
          <!-- 动态渲染 -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- 字典列表 Tab -->
  <div id="tab-dict-list" style="display:none;">
    <div class="header">
      <h1>字典管理</h1>
      <button class="btn btn-primary" onclick="saveGlobalDict()">保存修改</button>
    </div>
    <div class="card">
      <p style="color:var(--text-light); margin-bottom:15px; font-size:14px;">以下是前端页面的全量原始中文 JSON 字典结构（包含导航、Hero、弹窗等所有文案）。</p>
      <textarea id="global-dict-editor" class="json-editor"></textarea>
    </div>
  </div>

  <!-- API 配置 Tab -->
  <div id="tab-settings" style="display:none;">
    <div class="header"><h1>API 配置</h1></div>
    <div class="card">
      <div class="form-group">
        <label>修改后台密码</label>
        <input type="password" id="set-admin-pwd" placeholder="输入新密码，留空则不修改">
      </div>
      <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">
      <div class="form-group">
        <label>DeepL API Key (免费版或专业版)</label>
        <input type="text" id="set-deepl-key" placeholder="输入 DeepL API Key">
        <p style="font-size:12px; color:var(--text-light); margin-top:5px;">配置后，点击翻译功能将直接请求 DeepL API。</p>
      </div>
      <button class="btn btn-primary" onclick="saveSettings()">保存配置</button>
    </div>
  </div>

</div>

<!-- 批量选择语言弹窗 -->
<div class="modal-overlay" id="modal-batch-lang">
  <div class="modal">
    <div class="modal-header">
      <h2>添加常用国家语言</h2>
      <span class="close-btn" onclick="closeModal('modal-batch-lang')">×</span>
    </div>
    <div class="modal-body">
      <p style="font-size:14px; color:var(--text-light); margin-bottom:10px;">勾选需要添加的语言，添加后会默认自动翻译。</p>
      <div class="lang-grid" id="common-lang-grid">
        <!-- 动态渲染 -->
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-batch-lang')">取消</button>
      <button class="btn btn-primary" onclick="confirmBatchLang()">添加选中语言</button>
    </div>
  </div>
</div>

<!-- 编辑/翻译弹窗 -->
<div class="modal-overlay" id="modal-edit-json">
  <div class="modal">
    <div class="modal-header">
      <h2 id="edit-modal-title">编辑字典</h2>
      <span class="close-btn" onclick="closeModal('modal-edit-json')">×</span>
    </div>
    <div class="modal-body" style="position:relative;">
      <textarea class="json-editor" id="edit-json-textarea"></textarea>
      <div class="loading-overlay" id="translate-loading" style="position:absolute; inset:0; background:rgba(255,255,255,0.9);">
        <div class="spinner"></div>
        <div style="font-weight:600; color:var(--primary);">正在请求翻译引擎...</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-edit-json')">取消</button>
      <button class="btn btn-primary" onclick="saveLangJson()">保存字典</button>
    </div>
  </div>
</div>

<script>
/* =========================================
   1. 基础数据与初始化
   ========================================= */
   
// 完整提取的原版中文 JSON 字典
const DEFAULT_DICT = {
  "nav": { "quota": "本期开卡名额还剩", "unit": "个" },
  "hero": {
    "badge": "Visa 虚拟卡 · 限时免年费",
    "title1": "你的 USDC",
    "title2": "本来就不该",
    "title3": "躺着不动",
    "title4": "。",
    "desc1": "一张 Visa 卡，让稳定币在消费前",
    "desc2": "继续生息",
    "desc3": "，刷卡时自动清算，花完还有",
    "desc4": "返现",
    "desc5": "。不卖币，也能花。",
    "cta": "领取虚拟卡 · 免年费",
    "fineprint": "开卡免费，首笔消费后按 0.90% 收取交易费。无月费、无隐藏费用。",
    "scroll": "Scroll"
  },
  "stats": {
    "users": "全球用户", "fund": "用户保护基金",
    "chains": "支持公链", "merchants": "全球受理商户"
  },
  "modal": {
    "title": "领取你的 NEXA Visa 虚拟卡",
    "desc": "30 秒完成，开卡免费。这不是一张普通的卡——它让你的稳定币在消费前持续生息。",
    "cta": "开始领取",
    "foot": "已服务 1.5 亿 Visa 商户 · $700M 用户保护基金"
  }
};

// 常用 20 种语言预设
const COMMON_LANGS = [
  { code: "en-US", name: "English (US)" }, { code: "zh-TW", name: "繁體中文" },
  { code: "ja", name: "日本語" }, { code: "ko", name: "한국어" },
  { code: "es", name: "Español" }, { code: "fr", name: "Français" },
  { code: "de", name: "Deutsch" }, { code: "ru", name: "Русский" },
  { code: "pt", name: "Português" }, { code: "it", name: "Italiano" },
  { code: "vi", name: "Tiếng Việt" }, { code: "th", name: "ภาษาไทย" },
  { code: "id", name: "Bahasa Indonesia" }, { code: "ms", name: "Bahasa Melayu" },
  { code: "ar", name: "العربية" }, { code: "hi", name: "हिन्दी" },
  { code: "tr", name: "Türkçe" }, { code: "nl", name: "Nederlands" },
  { code: "pl", name: "Polski" }, { code: "sv", name: "Svenska" }
];

// 初始化 LocalStorage
if (!localStorage.getItem('nexa_admin_pwd')) localStorage.setItem('nexa_admin_pwd', 'admin888');
if (!localStorage.getItem('nexa_deepl_key')) localStorage.setItem('nexa_deepl_key', '');
if (!localStorage.getItem('nexa_global_dict')) localStorage.setItem('nexa_global_dict', JSON.stringify(DEFAULT_DICT, null, 2));

// 默认语言数据
if (!localStorage.getItem('nexa_langs')) {
  const initialLangs = [
    { code: "zh", name: "简体中文", status: true, dict: DEFAULT_DICT },
    { code: "en-US", name: "English (US)", status: true, dict: {} },
    { code: "vi", name: "Tiếng Việt", status: true, dict: {} }
  ];
  localStorage.setItem('nexa_langs', JSON.stringify(initialLangs));
}

let currentLangs = JSON.parse(localStorage.getItem('nexa_langs'));
let currentEditLangCode = ""; 

/* =========================================
   2. 登录与导航
   ========================================= */
function doLogin() {
  const pwd = document.getElementById('login-pwd').value;
  const saved = localStorage.getItem('nexa_admin_pwd');
  if (pwd === saved) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('sidebar').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
    renderLangTable();
    document.getElementById('global-dict-editor').value = localStorage.getItem('nexa_global_dict');
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}
function logout() { location.reload(); }

function toggleSubMenu(el) {
  const sub = document.getElementById('sub-lang');
  sub.classList.toggle('open');
}

function switchTab(tabId) {
  document.querySelectorAll('.main-content > div').forEach(el => el.style.display = 'none');
  document.getElementById('tab-' + tabId).style.display = 'block';
  document.querySelectorAll('.sub-item, .menu-item').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
}

/* =========================================
   3. 语言列表管理
   ========================================= */
function renderLangTable() {
  const tbody = document.getElementById('lang-tbody');
  tbody.innerHTML = '';
  currentLangs.forEach((lang, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${lang.code}</td>
      <td>${lang.name}</td>
      <td><span class="status-badge">启用中</span></td>
      <td class="actions">
        <span onclick="editLangJson('${lang.code}')">编辑字典</span>
        <span onclick="translateLang('${lang.code}')">一键翻译</span>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// 单个添加
function addSingleLang() {
  const code = document.getElementById('new-lang-code').value.trim();
  const name = document.getElementById('new-lang-name').value.trim();
  if (!code || !name) return alert('请填写代码和名称');
  if (currentLangs.find(l => l.code === code)) return alert('语言已存在');
  
  currentLangs.push({ code, name, status: true, dict: {} });
  saveLangs();
  document.getElementById('new-lang-code').value = '';
  document.getElementById('new-lang-name').value = '';
}

// 保存语言数据
function saveLangs() {
  localStorage.setItem('nexa_langs', JSON.stringify(currentLangs));
  renderLangTable();
}

/* =========================================
   4. 批量添加弹窗逻辑
   ========================================= */
function openBatchLangModal() {
  const grid = document.getElementById('common-lang-grid');
  grid.innerHTML = '';
  COMMON_LANGS.forEach(lang => {
    // 如果已经添加过，则禁用
    const exists = currentLangs.find(l => l.code === lang.code);
    const isDisabled = exists ? 'disabled checked' : '';
    const label = document.createElement('label');
    label.className = 'lang-checkbox';
    label.innerHTML = `<input type="checkbox" value="${lang.code}" data-name="${lang.name}" ${isDisabled}> ${lang.name} (${lang.code})`;
    grid.appendChild(label);
  });
  document.getElementById('modal-batch-lang').classList.add('show');
}

function confirmBatchLang() {
  const checked = document.querySelectorAll('#common-lang-grid input[type="checkbox"]:checked:not(:disabled)');
  let added = 0;
  checked.forEach(cb => {
    currentLangs.push({ code: cb.value, name: cb.dataset.name, status: true, dict: {} });
    added++;
  });
  if (added > 0) {
    saveLangs();
    closeModal('modal-batch-lang');
  } else {
    alert('没有选择新的语言');
  }
}

/* =========================================
   5. 字典编辑与翻译
   ========================================= */
function editLangJson(code) {
  const lang = currentLangs.find(l => l.code === code);
  currentEditLangCode = code;
  document.getElementById('edit-modal-title').innerText = `编辑字典: ${lang.name} (${lang.code})`;
  
  // 如果是空对象，预填中文结构方便修改
  const dictToEdit = Object.keys(lang.dict).length === 0 
      ? JSON.parse(localStorage.getItem('nexa_global_dict')) 
      : lang.dict;
      
  document.getElementById('edit-json-textarea').value = JSON.stringify(dictToEdit, null, 2);
  document.getElementById('modal-edit-json').classList.add('show');
}

function saveLangJson() {
  try {
    const json = JSON.parse(document.getElementById('edit-json-textarea').value);
    const lang = currentLangs.find(l => l.code === currentEditLangCode);
    lang.dict = json;
    saveLangs();
    closeModal('modal-edit-json');
  } catch (e) {
    alert('JSON 格式错误，请检查');
  }
}

// 模拟或真实调用 DeepL 翻译
async function translateLang(code) {
  const lang = currentLangs.find(l => l.code === code);
  currentEditLangCode = code;
  document.getElementById('edit-modal-title').innerText = `翻译中: ${lang.name} (${lang.code})`;
  document.getElementById('edit-json-textarea').value = JSON.stringify(lang.dict || {}, null, 2);
  document.getElementById('modal-edit-json').classList.add('show');
  
  const loading = document.getElementById('translate-loading');
  loading.classList.add('show');

  const sourceDict = JSON.parse(localStorage.getItem('nexa_global_dict'));
  const apiKey = localStorage.getItem('nexa_deepl_key');

  // 模拟延迟和翻译结果
  setTimeout(async () => {
    // 这里用前端模拟递归翻译。如果有真实 API，需要遍历 JSON 的每个 value 去请求。
    let translatedDict = JSON.parse(JSON.stringify(sourceDict));
    
    // 如果真的配置了 API Key，这里做一次真实请求尝试（演示用）
    if (apiKey) {
      try {
        // 仅选取一个词做演示请求
        const res = await fetch(`https://api-free.deepl.com/v2/translate?auth_key=${apiKey}&text=你的 USDC&target_lang=${code.split('-')[0].toUpperCase()}`);
        // 如果有跨域，这里会 catch
      } catch(e) {
        console.warn("跨域限制，启用前端模拟翻译", e);
      }
    }
    
    // 前端模拟假翻译 (只给部分字段加前缀)
    const simulateTrans = (obj) => {
      for (let k in obj) {
        if (typeof obj[k] === 'object') simulateTrans(obj[k]);
        else obj[k] = `[${lang.code.toUpperCase()}] ${obj[k]}`;
      }
    };
    simulateTrans(translatedDict);

    lang.dict = translatedDict;
    saveLangs();
    
    loading.classList.remove('show');
    document.getElementById('edit-json-textarea').value = JSON.stringify(lang.dict, null, 2);
    document.getElementById('edit-modal-title').innerText = `翻译完成: ${lang.name}`;
  }, 1500);
}

// 全局翻译
function globalTranslate() {
  if(!confirm('确定要自动翻译所有缺失的字典项吗？这可能会覆盖现有翻译。')) return;
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.innerHTML = '<div class="modal" style="text-align:center; padding:40px;"><div class="spinner" style="margin:0 auto 20px;"></div><h3>正在全局同步翻译...</h3></div>';
  document.body.appendChild(overlay);

  setTimeout(() => {
    const sourceDict = JSON.parse(localStorage.getItem('nexa_global_dict'));
    currentLangs.forEach(lang => {
      if (lang.code !== 'zh') {
         let translated = JSON.parse(JSON.stringify(sourceDict));
         const simulate = (obj) => {
           for(let k in obj) {
             if(typeof obj[k] === 'object') simulate(obj[k]);
             else obj[k] = `[${lang.code.toUpperCase()}] ${obj[k]}`;
           }
         };
         simulate(translated);
         lang.dict = translated;
      }
    });
    saveLangs();
    document.body.removeChild(overlay);
    alert('全局翻译完成！');
  }, 2000);
}

/* =========================================
   6. 系统配置
   ========================================= */
function saveSettings() {
  const newPwd = document.getElementById('set-admin-pwd').value;
  const deeplKey = document.getElementById('set-deepl-key').value;

  if (newPwd) {
    if(newPwd.length < 6) return alert('密码长度至少6位');
    localStorage.setItem('nexa_admin_pwd', newPwd);
    alert('后台密码已更新');
    document.getElementById('set-admin-pwd').value = '';
  }
  
  if (deeplKey) {
    localStorage.setItem('nexa_deepl_key', deeplKey);
    alert('DeepL API Key 已保存');
  }
}

function saveGlobalDict() {
  try {
    const parsed = JSON.parse(document.getElementById('global-dict-editor').value);
    localStorage.setItem('nexa_global_dict', JSON.stringify(parsed, null, 2));
    alert('全局中文源字典已保存');
  } catch(e) {
    alert('JSON 格式错误');
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
</script>
</body>
</html>
